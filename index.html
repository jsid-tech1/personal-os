<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Personal OS — a second brain that turns what you want into a schedule you can keep." />
<meta name="theme-color" content="#F2F2EE" />
<title>Personal OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121417'/%3E%3Cpath d='M9 22V10h6.2c3 0 4.8 1.7 4.8 4.3 0 2.8-2 4.5-5.1 4.5H12V22z' fill='%23FAFAF7'/%3E%3Crect x='21' y='10' width='2.4' height='12' rx='1.2' fill='%232036D6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/screens.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div id="offline-banner" class="offline-banner" hidden role="status">
  <span class="offline-dot" aria-hidden="true"></span>
  You're offline. Your work is saved on this device and everything keeps working.
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <a class="brand-mark" href="#/today" aria-label="Personal OS home">
        <span class="brand-glyph" aria-hidden="true"><span></span><span></span></span>
        <span class="brand-word">Personal&nbsp;<em>OS</em></span>
      </a>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn topbar-menu" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>
        <div class="crumb" id="crumb" aria-live="polite"></div>
      </div>
      <div class="topbar-right">
        <button class="search-trigger" id="search-btn" aria-label="Search everything (Ctrl K)">
          <span class="search-trigger-icon" data-icon="search"></span>
          <span class="search-trigger-label">Search</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="notify-btn" aria-label="Notifications" aria-haspopup="dialog"></button>
        <button class="btn btn-primary btn-capture" id="capture-btn" aria-label="Capture">
          <span data-icon="plus"></span><span>Capture</span>
        </button>
        <button class="avatar" id="avatar-btn" aria-label="Open control centre" title="Control centre">CS</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>

<nav class="mobilebar" id="mobilebar" aria-label="Primary mobile"></nav>

<div id="overlay-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/firebase.js"></script>
<script src="js/ai.js"></script>
<script src="js/deepseek.js"></script>
<script src="js/components.js"></script>
<script src="js/views/today.js"></script>
<script src="js/views/brain-dump.js"></script>
<script src="js/views/goal.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/planner.js"></script>
<script src="js/views/notifications.js"></script>
<script src="js/views/focus.js"></script>
<script src="js/views/reschedule.js"></script>
<script src="js/views/notes.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/reflection.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
